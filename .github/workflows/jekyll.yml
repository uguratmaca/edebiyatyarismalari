# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Daily rebuild (06:17 Istanbul): pages that depend on the date
  # (yarismalar.json, social.json reminders and the Monday list) stay current
  # on days nothing is pushed. Off the hour: GitHub delays top-of-hour runs.
  schedule:
    - cron: "17 3 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and prebuilt
    # Ruby 3.1 / Python 3.11 for a new image can lag or never come (Ruby 3.1
    # is past end of life). Move up together with the Ruby version.
    runs-on: ubuntu-24.04
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Social media feed
        # _site/social.json and the contests' JPEG images (scripts/social_feed.py).
        # A failure here must not stop the site from deploying.
        continue-on-error: true
        run: |
          pip install pillow==12.3.0 PyYAML==6.0.3
          python scripts/social_feed.py --site _site
      - name: IndexNow list
        # The live sitemap vs this build's: new, changed and removed pages,
        # sent after the deploy by the indexnow job (scripts/indexnow.py).
        id: indexnow
        continue-on-error: true
        run: |
          {
            echo "urls<<INDEXNOW_EOF"
            python scripts/indexnow.py diff --new _site/sitemap.xml
            echo "INDEXNOW_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Bing, Yandex & co. crawl the deploy's new and changed pages within minutes.
  indexnow:
    runs-on: ubuntu-24.04
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_urls != ''
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ping IndexNow
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: echo "$URLS" | python3 scripts/indexnow.py send
